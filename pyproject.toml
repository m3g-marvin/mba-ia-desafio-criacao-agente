[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora com Google ADK e regras em código"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "google-adk==2.9.1",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[project.scripts]
aurora-api = "aurora.cli:serve"
aurora-reset = "aurora.cli:reset"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
